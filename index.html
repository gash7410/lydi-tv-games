<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lydi Show TV Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Noto+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tv.css">
</head>
<body>
<canvas id="stage"></canvas>
<canvas id="stage2" hidden></canvas>

<div id="hud" hidden>
  <div class="hud-top">
    <div class="brand">Lydi Show<span>TV Games</span></div>
    <div class="room">Δωμάτιο <b id="hudCode">····</b></div>
  </div>
  <div id="banner"></div>
  <div id="playersBar"></div>
</div>

<section id="lobby">
  <div class="lobby-left">
    <div class="brand big">Lydi Show<span>TV Games</span></div>
    <div class="games" id="games"></div>
    <h1 id="gTitle">Μπαλάκι <span>στα ποτηράκια</span></h1>
    <p class="tag" id="gTag"></p>
    <ol class="steps">
      <li>Σκάναρε τον QR και γράψε το όνομά σου</li>
      <li id="gHow">Σύρε το μπαλάκι προς τα πάνω και άφησέ το</li>
    </ol>
    <div class="slots" id="slots"></div>
    <div class="actions">
      <button id="btnStart" class="btn primary" disabled>Έναρξη</button>
      <button id="btnCups" class="btn">Ποτηράκια: 10</button>
      <button id="btnFull" class="btn">Πλήρης οθόνη</button>
    </div>
    <p class="hint" id="startHint"></p>
  </div>
  <div class="lobby-right">
    <div class="qr-card">
      <div id="qr"><div class="qr-wait">Φόρτωση…</div></div>
      <div class="code-label">ή άνοιξε το χειριστήριο και γράψε τον κωδικό</div>
      <div id="code">····</div>
      <div id="netStatus"></div>
    </div>
  </div>
</section>

<section id="over" hidden>
  <div class="over-card">
    <div class="trophy">🏆</div>
    <div class="over-k">Νικητής</div>
    <div id="winName"></div>
    <div id="winStats"></div>
    <ol id="rank"></ol>
    <div class="actions">
      <button id="btnAgain" class="btn primary">Ξανά</button>
      <button id="btnLobby" class="btn">Μενού παιχνιδιών</button>
    </div>
  </div>
</section>

<script src="js/tvdebug.js"></script>
<script src="js/version.js"></script>
<script src="js/vendor/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="js/common.js"></script>
<script src="js/game-cups.js"></script>
<script src="js/mini-common.js"></script>
<script src="js/game-star.js"></script>
<script src="js/game-balloon.js"></script>
<script src="js/game-race.js"></script>
<script src="js/game-trail.js"></script>
<script src="js/game-longjump.js"></script>
<script src="js/game-panda.js"></script>
<script src="js/game-tomato.js"></script>
<script src="js/game-hoops.js"></script>
<script src="js/game-bubpanda.js"></script>
<script src="js/game-bubbles.js"></script>
<script src="js/game-space.js"></script>
<script src="js/game-sumo.js"></script>
<script src="js/game-who.js"></script>
<script src="js/tv.js"></script>
<script src="js/updater.js"></script>
</body>
</html>
