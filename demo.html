<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lydi TV Games — Εικονική δοκιμή</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#0d0f1a;color:#f2f3ff;font-family:system-ui,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
  body{padding:14px;display:flex;flex-direction:column;align-items:center;gap:14px}
  header{width:100%;max-width:1400px}
  h1{font-size:20px}
  header p{color:#9aa0c3;font-size:13px;margin-top:4px}
  .wrap{width:100%;max-width:1400px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
  .tv{background:#05060b;border:10px solid #222538;border-radius:16px;aspect-ratio:16/9;overflow:hidden}
  .tv iframe{width:100%;height:100%;border:0;display:block}
  .phones{display:flex;gap:12px}
  .phone{width:240px;display:flex;flex-direction:column;gap:6px}
  .phone b{font-size:13px;text-align:center}
  .phone .frame{background:#05060b;border:8px solid #222538;border-radius:26px;height:540px;overflow:hidden}
  .phone iframe{width:100%;height:100%;border:0;display:block}
  .wait{display:flex;align-items:center;justify-content:center;height:100%;color:#9aa0c3;font-size:13px;text-align:center;padding:10px}
  button{background:#ffc93d;color:#1a1400;border:0;border-radius:10px;padding:8px 16px;font:700 14px system-ui;cursor:pointer}
  @media (max-width:1100px){.wrap{grid-template-columns:1fr}.phones{justify-content:center}}
  @media (max-width:500px){.phone{width:calc(50vw - 20px)}.phone .frame{height:400px}}
</style>
</head>
<body>
<header>
  <h1>📺 Lydi TV Games — εικονική δοκιμή</h1>
  <p>Αριστερά είναι η «τηλεόραση», δεξιά δύο «κινητά-χειριστήρια», όλα στην ίδια σελίδα. Γράψε όνομα σε κάθε κινητό, πάτα «Έναρξη» και σύρε το μπαλάκι προς τα πάνω.</p>
</header>
<div class="wrap">
  <div class="tv"><iframe id="tv" src="index.html" title="Τηλεόραση"></iframe></div>
  <div class="phones">
    <div class="phone"><b>📱 Κινητό 1</b><div class="frame" id="ph1"><div class="wait">Περιμένω την τηλεόραση…</div></div></div>
    <div class="phone"><b>📱 Κινητό 2</b><div class="frame" id="ph2"><div class="wait">Περιμένω την τηλεόραση…</div></div></div>
  </div>
</div>
<button id="reload">↻ Ξεκίνα από την αρχή</button>
<script>
  // Η τηλεόραση γράφει τον κωδικό δωματίου στο localStorage (ίδιο origin) — τον διαβάζουμε και ανοίγουμε τα χειριστήρια.
  let tries = 0;
  function attach() {
    let code = '';
    try { const d = document.getElementById('tv').contentDocument; code = (d.getElementById('code')||{}).textContent || ''; } catch (e) {}
    code = (code || '').trim();
    if (!/^\d{4}$/.test(code)) { if (++tries < 60) return setTimeout(attach, 500);
      document.querySelectorAll('.wait').forEach(w => w.textContent = 'Η τηλεόραση δεν πήρε κωδικό. Πάτα «Ξεκίνα από την αρχή».'); return; }
    ['ph1','ph2'].forEach((id, k) => setTimeout(() => {
      document.getElementById(id).innerHTML = `<iframe src="controller.html?r=${code}" title="Κινητό ${k+1}" allow="vibrate"></iframe>`;
    }, k * 700));
  }
  setTimeout(attach, 1200);
  document.getElementById('reload').onclick = () => location.reload();
</script>
</body>
</html>
