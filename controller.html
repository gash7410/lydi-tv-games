<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140a33">
<title>Χειριστήριο — Lydi TV Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Noto+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/controller.css">
</head>
<body>
<header class="top">
  <div class="brand">Lydi<span>TV Games</span></div>
  <div id="conn" class="conn">εκτός σύνδεσης</div>
</header>

<section id="scrJoin" class="scr">
  <h1>Έλα να<br><span>παίξουμε!</span></h1>
  <form id="joinForm" autocomplete="off">
    <label>Κωδικός δωματίου (στην τηλεόραση)
      <input id="inCode" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="1234" required>
    </label>
    <label>Το όνομά σου
      <input id="inName" maxlength="12" placeholder="π.χ. Νίκος" required>
    </label>
    <button class="btn primary" id="btnJoin" type="submit">Μπες στο παιχνίδι</button>
    <p id="joinErr" class="err"></p>
  </form>
</section>

<section id="scrWait" class="scr" hidden>
  <div class="badge" id="badge"><div class="av" id="myAv"></div><div id="myName"></div><div id="myColor"></div></div>
  <p id="waitMsg" class="big-msg"></p>
  <p id="waitSub" class="sub"></p>
  <div id="gameNow" class="game-now"></div>
  <div id="picker" class="picker" hidden></div>
  <div class="wait-end">
    <button id="btnStart" class="btn primary" hidden>Έναρξη παιχνιδιού</button>
    <button id="btnLobby" class="btn" hidden>Νέοι παίκτες</button>
  </div>
</section>

<section id="scrPad" class="scr pad-scr" hidden>
  <div class="pad-info"><b id="padName"></b><span id="padLeft"></span></div>
  <div id="pad">
    <div class="target"><div class="tri"></div></div>
    <div id="meter"><div id="meterFill"></div></div>
    <div id="ball"></div>
    <div class="pad-hint" id="padHint">Σύρε το μπαλάκι προς τα πάνω<br><small>όσο πιο ψηλά, τόσο πιο δυνατά · λοξά για στόχευση</small></div>
  </div>
</section>

<section id="scrTap" class="scr play-scr" hidden>
  <div class="pad-info"><b class="pName"></b><span class="pScore"></span></div>
  <div class="tap-wrap">
    <button id="tapBtn" class="tap-btn" type="button"><span id="tapLabel">ΠΑΤΑ!</span></button>
  </div>
  <p id="tapSub" class="play-sub"></p>
</section>

<section id="scrRun" class="scr play-scr" hidden>
  <div class="pad-info"><b class="pName"></b><span class="pScore"></span></div>
  <p id="runMsg" class="joy-msg"></p>
  <div class="run-wrap">
    <button id="runBtn" class="run-btn" type="button">ΤΡΕΞΕ<small>πάτα γρήγορα</small></button>
    <button id="jumpBtn" class="run-btn jump" type="button">ΑΛΜΑ<small>πριν το εμπόδιο</small></button>
  </div>
  <p id="runSub" class="play-sub"></p>
</section>

<section id="scrPlat" class="scr play-scr gp" hidden>
  <div class="gp-in">
    <div class="gp-top"><b class="pName"></b><span id="platMsg" class="gp-msg"></span><span id="platScore" class="gp-score"></span><button id="gpGear" class="gp-gear" type="button" aria-label="Ρύθμιση κουμπιών">⚙</button></div>
      <div id="gpEdit" class="gp-edit" hidden>
        <span class="gp-edit-t">✋ Σύρε τα κουμπιά όπου σε βολεύει</span>
        <button id="gpSmall" type="button" aria-label="Μικρότερο">−</button><button id="gpBig" type="button" aria-label="Μεγαλύτερο">+</button>
        <button id="gpReset" type="button">↺ Αρχικά</button><button id="gpDone" class="ok" type="button">✓ Έτοιμο</button>
      </div>
    <div class="gp-body">
      <div class="gp-left">
        <div id="gpStick" class="gp-stick" aria-label="Κατεύθυνση">
          <i class="gp-arr up"></i><i class="gp-arr rt"></i><i class="gp-arr dn"></i><i class="gp-arr lf"></i>
          <div id="gpKnob" class="gp-knob"></div>
        </div>
      </div>
      <div class="gp-right">
        <button id="platExtra" class="gp-btn extra" type="button">ΤΡΕΞΕ</button>
        <button id="platJump" class="gp-btn jump" type="button">ΠΗΔΑ</button>
        <button id="platShoot" class="gp-btn shoot" type="button">ΡΙΞΕ</button>
      </div>
    </div>
    <p id="platSub" class="gp-sub"></p>
  </div>
</section>

<section id="scrChoice" class="scr play-scr" hidden>
  <div class="pad-info"><b class="pName"></b><span class="pScore"></span></div>
  <p id="choiceMsg" class="joy-msg"></p>
  <div id="choices" class="choices"></div>
  <p id="choiceSub" class="play-sub"></p>
</section>

<section id="scrCards" class="scr play-scr gp xr" hidden>
  <div class="gp-in xr-in">
    <div class="xr-top"><b class="pName"></b><span id="cardsMsg" class="xr-msg"></span><span id="cardsScore" class="xr-score"></span></div>
    <div class="xr-body">
      <div class="xr-table">
        <div class="xr-slot">
          <span class="xr-lbl">Στο τραπέζι</span>
          <div class="xr-pile"><i class="xr-under"></i><i class="xr-under u2"></i><div id="cardsTop" class="pc"></div></div>
          <b id="cardsPileN" class="xr-cnt"></b>
        </div>
        <div class="xr-slot deck">
          <span class="xr-lbl">Τράπουλα</span>
          <div class="xr-deck"><i class="pc back"></i><i class="pc back"></i><i class="pc back"></i></div>
          <b id="cardsDeckN" class="xr-cnt"></b>
        </div>
      </div>
      <div id="hand" class="hand"></div>
      <div class="xr-btns">
        <button id="btnThrow" class="cbtn throw" type="button"><i>🃏</i>ΠΕΤΑ</button>
        <button id="btnTake" class="cbtn take" type="button"><i>✋</i>ΠΑΡΕ ΤΑ</button>
      </div>
    </div>
    <p id="cardsSub" class="xr-sub"></p>
    <div id="cardsHint" class="xr-hint"></div>
  </div>
</section>

<div id="fxMsg" class="fx-msg"></div>
<div id="flash"></div>

<script src="js/vendor/peerjs.min.js"></script>
<script src="js/common.js"></script>
<script src="js/controller.js"></script>
</body>
</html>
